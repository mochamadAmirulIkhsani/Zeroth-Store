name: Keep Supabase Awake

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit Supabase
        run: |
          curl -sS -o /dev/null -w "%{http_code}\n" "$SUPABASE_URL"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}